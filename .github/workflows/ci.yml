name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck registry
        run: cd registry && npx tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Format check
        run: pnpm format:check

      - name: Build core
        run: pnpm --filter @agentive-ui/core build

      - name: Build registry
        run: pnpm registry:build

      - name: Verify registry output
        run: |
          test -f apps/www/public/r/registry.json
          test -f apps/www/public/r/conversation.json
          echo "Registry output verified"

      - name: Build docs site
        run: pnpm --filter @agentive-ui/www build

      - name: Build mock playground
        run: pnpm --filter @agentive-ui/mock-playground build

      - name: Build AI SDK chat example
        run: pnpm --filter @agentive-ui/ai-sdk-chat build
